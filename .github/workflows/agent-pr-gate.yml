# ============================================================================
# Reusable: agent-pr-gate
# ============================================================================
# A required check that keeps the bullpen's runner App from merging its own
# pull requests (lentago/claytonia#117 option A; lentago/.github ADR-0014).
#
# - A PR the runner App did not author passes at once, without reading
#   anything, so human-authored PRs armed with `--auto --squash` merge on green
#   exactly as before.
# - A runner-App PR passes when a non-bot user with write access has approved
#   the head commit being checked. A later push makes that approval stop
#   counting: the push re-runs the gate on the new head.
# - Under the routine exception (ADR-0014 point 4), a runner-App PR also passes
#   when the runner App's latest `cr-automerge` record on the PR
#   (`<!-- cr-automerge armed rule=<rule> head=<sha> -->`, lentago/claytonia
#   #178) names the head being checked and the PR still meets that rule, read
#   from the default branch's `.claytonia/automerge.json`. A push after arming
#   moves the head away from the record, and the gate fails. The rule is checked
#   again here because the runner App can post that comment itself.
#
# UNCONDITIONAL BY DESIGN. Callers trigger this with no `paths:` filter and
# this job has no draft skip: a required context that never reports holds the
# PR at "Expected" forever.
#
# Read-only (`contents: read`, `pull-requests: read`; the collaborator
# permission endpoint needs only the metadata read every token has): the token
# reads the PR, its reviews and comments, each approver's permission, and the
# default branch's automerge policy. Nothing is written. Any API error fails
# the check.
#
# LIMIT: this is the accident layer. The runner App holds `workflows: write`,
# so a PR it opens can add a workflow whose job reports a passing check under
# this check's name, and every Actions job reports from the same source. This
# check stops a merge the App attempts by mistake, not one it is trying to
# force. The boundary is agent-pr-verdict.yml (#97): the same decision, posted
# as a check run by a separate GitHub App and required by that App's
# integration ID. See README.md, "agent-pr-gate.yml" and "agent-pr-verdict.yml".
#
# IDENTITY BY ID. The PR's author is the runner App when the event's
# `pull_request.user.id` is the App's bot account (`agent_user_id`), and a
# cr-automerge record is the App's when the comment's
# `performed_via_github_app.id` is the App's integration ID (`agent_app_id`).
# Logins decide nothing: GitHub's APIs spell the App's login two ways, and one
# of them is a valid login for a human account. `agent_author` stays as an
# input; it names the App in messages. A caller that sets it to another agent
# while either ID is still the runner App's default fails the job, rather than
# gating the runner App and passing its own agent's PRs.
#
# The logic lives in ci/agent_pr_gate.py (tests: ci/test_agent_pr_gate.py),
# checked out from this repository at this workflow file's own commit
# (`job.workflow_sha`), so a caller pinned to a tag runs that tag's script. On
# this repository's own PRs it comes from the PR's base commit instead, so a
# PR can't edit the script that checks it.
# ============================================================================

name: agent-pr-gate (reusable)

on:
  workflow_call:
    inputs:
      agent_author:
        description: "Login of the agent whose PRs are gated. Used in messages only since v1.7.0; identity is agent_user_id and agent_app_id."
        type: string
        default: "lentago-claude-runner[bot]"
      agent_user_id:
        description: "Numeric user id of the agent App's bot account. A PR is gated when its author has this id."
        type: number
        default: 293961292
      agent_app_id:
        description: "Numeric integration id of the agent App. A cr-automerge record counts only when posted through this App."
        type: number
        default: 4062202

jobs:
  agent-pr-gate:
    name: agent-pr-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # One evaluation per head commit at a time. Events for the same head queue
    # behind the running one, never cancel it: a run waiting for cr-automerge's
    # record must finish, and the last queued run then reads the latest state.
    # Runs for different heads don't wait for each other.
    concurrency:
      group: agent-pr-gate-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false

    steps:
      - name: Is this PR gated?
        id: who
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          AGENT: ${{ inputs.agent_author }}
          AGENT_ID: ${{ inputs.agent_user_id }}
          AGENT_APP_ID: ${{ inputs.agent_app_id }}
        run: |
          if [[ -z "$NUMBER" ]]; then
            echo "::error::agent-pr-gate runs on pull_request and pull_request_review events; this event carries no pull request"
            exit 1
          fi
          # Until v1.7.0 the login decided. A caller that names another agent by
          # agent_author alone would now gate the runner App instead and pass its
          # own agent's PRs here, before the script runs: refuse it. The script
          # makes the same check (mixed_identity) for the gated path.
          if [[ "${AGENT,,}" != "lentago-claude-runner[bot]" && ( "$AGENT_ID" == 293961292 || "$AGENT_APP_ID" == 4062202 ) ]]; then
            echo "::error::agent_author is '$AGENT', but agent_user_id ($AGENT_ID) or agent_app_id ($AGENT_APP_ID) is still the runner App's default: since v1.7.0 the IDs decide, so set agent_user_id and agent_app_id for that agent"
            exit 1
          fi
          if [[ ! "$AUTHOR_ID" =~ ^[0-9]+$ || ! "$AGENT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::agent-pr-gate can't tell the author (user id '$AUTHOR_ID') from the agent (user id '$AGENT_ID')"
            exit 1
          fi
          if [[ "$AUTHOR_ID" != "$AGENT_ID" ]]; then
            echo "PR #$NUMBER is authored by $AUTHOR (user $AUTHOR_ID), not $AGENT (user $AGENT_ID): nothing to gate."
            echo "gated=false" >> "$GITHUB_OUTPUT"
          else
            echo "gated=true" >> "$GITHUB_OUTPUT"
          fi

      # The script comes from the same commit as this workflow file
      # (job.workflow_sha), so a caller pinned to a tag runs that tag's script.
      # An empty value fails the check: with no ref, actions/checkout would
      # silently take the default branch. One exception: called from this
      # repository's own PR (`uses: ./…`, a pull-request ref), the script comes
      # from the PR's base commit, so a PR can't edit the script that checks it.
      - name: Resolve the script's commit
        if: steps.who.outputs.gated == 'true'
        id: swref
        env:
          WF_FILE_REF: ${{ job.workflow_ref }}
          WF_SHA: ${{ job.workflow_sha }}
          WF_REPO: ${{ job.workflow_repository }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ref=$WF_SHA
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ || -z "$WF_REPO" ]]; then
            echo "::error::agent-pr-gate can't tell which commit it runs from (job.workflow_repository '$WF_REPO', job.workflow_sha '$ref')"
            exit 1
          fi
          if [[ "${REPO,,}" == "${WF_REPO,,}" && "$WF_FILE_REF" == *@refs/pull/* ]]; then
            echo "Called from this repository's own PR: the script comes from base commit $BASE_SHA, not $ref."
            ref=$BASE_SHA
          fi
          echo "Script: $WF_REPO@$ref"
          echo "repository=$WF_REPO" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout agent-pr-gate tooling
        if: steps.who.outputs.gated == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.swref.outputs.repository }}
          ref: ${{ steps.swref.outputs.ref }}
          path: .agent-pr-gate-tooling
          sparse-checkout: ci
          fetch-depth: 1
          persist-credentials: false

      - name: Check approval or routine record
        if: steps.who.outputs.gated == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          AGENT: ${{ inputs.agent_author }}
          AGENT_USER_ID: ${{ inputs.agent_user_id }}
          AGENT_APP_ID: ${{ inputs.agent_app_id }}
          ACTION: ${{ github.event.action }}
          ARMED: ${{ github.event.pull_request.auto_merge && 'armed' || '' }}
        run: |
          # cr-automerge arms first and posts its record a moment later. Any run
          # on an armed PR (the run arming triggers, or one queued behind it)
          # waits up to two minutes for a record of this head; an approval or a
          # record already in place ends the wait at once.
          WAIT=0
          [[ "$ACTION" == auto_merge_enabled || -n "$ARMED" ]] && WAIT=120
          python3 .agent-pr-gate-tooling/ci/agent_pr_gate.py \
            --repo "$REPO" --pr "$NUMBER" --head-sha "$HEAD_SHA" \
            --author-id "$AUTHOR_ID" --author-login "$AUTHOR" \
            --agent-user-id "$AGENT_USER_ID" --agent-app-id "$AGENT_APP_ID" --agent-login "$AGENT" \
            --wait-for-marker "$WAIT"
