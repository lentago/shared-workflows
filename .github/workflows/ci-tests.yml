# ============================================================================
# ci-tests: run this repo's own ci/ unit tests on every PR (#99)
# ============================================================================
# ci/agent_pr_gate.py decides whether runner-App PRs may merge, and
# ci/check_docs_links.py is docs-check's resolver. Until this workflow, their
# tests ran only when someone ran them by hand, so a change that broke them
# could merge green.
#
# Each ci/test_*.py runs as a script, the way its docstring says to run it.
# test_agent_pr_gate.py is unittest-based; test_check_docs_links.py is a
# self-contained script that `python3 -m unittest discover` would not find, so
# discovery would skip it silently. A new ci/test_*.py is picked up without
# editing this file, and the job fails if the glob matches nothing.
#
# Not a reusable workflow: these are this repo's tests, and callers never run
# them. Unconditional, with no `paths:` filter, so its context
# (`ci-tests / unit-tests`) can become a required check without holding
# non-matching PRs at "Expected". Making it required is lentago/.github's
# required-checks.json, after it has been seen reporting here.
# ============================================================================

name: ci-tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run every ci/test_*.py
        run: |
          shopt -s nullglob
          tests=(ci/test_*.py)
          if (( ${#tests[@]} == 0 )); then
            echo "::error::no ci/test_*.py found"
            exit 1
          fi
          failed=()
          for t in "${tests[@]}"; do
            echo "::group::$t"
            if ! python3 "$t"; then
              failed+=("$t")
            fi
            echo "::endgroup::"
          done
          if (( ${#failed[@]} > 0 )); then
            echo "::error::failing test files: ${failed[*]}"
            exit 1
          fi
          echo "All ${#tests[@]} test files passed: ${tests[*]}"
