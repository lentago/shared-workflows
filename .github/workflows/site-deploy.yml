# ============================================================================
# Reusable: Astro site → ECR → ECS Fargate (site-deploy.yml)
# ============================================================================
# Builds an Astro static site, packages it into an nginx Docker image, pushes
# to ECR (sha tag only), runs a Trivy vulnerability scan, attests the image
# via actions/attest-build-provenance, then registers a new ECS task-definition
# revision that names the image by digest and rolls the service onto it.
#
# Digest-pinned deploys: the pushed image's digest is resolved from ECR, and
# the service's current task definition is copied into a new revision with
# the app container's image set to <registry>/<ecr_repo>@<digest>. The app
# container is the one whose image already points at <registry>/<ecr_repo>
# (by tag or digest); sidecars such as the FireLens log router are left as
# they are. No :latest tag is pushed, so the ECR repo can be IMMUTABLE. The
# :<sha> tag stays as the human-readable handle. The attestation below covers
# the same digest the running task names.
#
# Deploy-role IAM: ecs:DescribeServices, ecs:DescribeTaskDefinition,
# ecs:RegisterTaskDefinition, ecs:UpdateService, ecr:DescribeImages, and
# iam:PassRole on the task and execution roles the task definition carries.
# Task-definition tags are not copied to the new revision (that would also
# need ecs:TagResource).
#
# SLSA Build L3 note: building inside a reusable workflow (rather than a
# workflow defined in the caller's own repo) satisfies SLSA Build L3, because
# the build definition is hosted in a repository the calling repo cannot
# modify — eliminating the "hosted by the build requester" gap that caps
# direct workflows at L2.
#
# Authenticates via OIDC; no long-lived AWS credentials required.
#
# Version file: right after checkout (before any pre-build command) the
# workflow writes `version_file` (default public/version.json) containing
# {sha, repo, built_at, run_url}. Astro copies public/ verbatim, so the site
# serves it at /version.json and a probe can compare the live commit with
# `main`. Point `version_file` at another path if the site's public directory
# differs; set it to "" to disable the step.
#
# Required caller permissions (workflow-level or job-level):
#   id-token: write     — OIDC for AWS auth and attestation signing
#   contents: read      — standard repository checkout
#   attestations: write — store build provenance in GitHub's attestation store
#   packages: read      — required by actions/attest-build-provenance
#
# Attestations are stored in GitHub's Sigstore-backed store (not pushed to
# ECR). Verify after deployment:
#   gh attestation verify oci://<registry>/<ecr_repo>@<digest> --owner lentago
# ============================================================================

name: Site Deploy (reusable)

on:
  workflow_call:
    inputs:
      ecr_repo:
        description: "ECR repository name (e.g. solidago-dev-lentago)"
        type: string
        required: true
      ecs_cluster:
        description: "ECS cluster name (e.g. solidago-dev-cluster)"
        type: string
        required: true
      ecs_service:
        description: "ECS service name (e.g. solidago-dev-lentago)"
        type: string
        required: true
      role_arn:
        description: "AWS IAM role ARN to assume via OIDC"
        type: string
        required: true
      aws_region:
        description: "AWS region"
        type: string
        default: "us-east-1"
      node_version:
        description: "Node.js version for the Astro build"
        type: string
        default: "20"
      fetch_depth:
        description: "Git fetch depth passed to actions/checkout (0 = full history; required for Starlight lastUpdated)"
        type: number
        default: 1
      pre_build_command:
        description: "Optional shell command to run after npm ci and before npm run build (e.g. a content-sync script)"
        type: string
        default: ""
      build_env_vars:
        description: "Newline-separated KEY=VALUE pairs exported as environment variables before npm run build"
        type: string
        default: ""
      version_file:
        description: "Path of the JSON file recording the deployed commit, written after checkout and before the build (default public/version.json is served at /version.json); empty disables"
        type: string
        default: "public/version.json"
      attest:
        description: "Attest the pushed image with actions/attest-build-provenance (SLSA Build L3)"
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # NO job-level concurrency here — deliberately. Concurrency policy belongs
    # to the CALLER (all three site repos hold a workflow-level `deploy-main`
    # group). A group declared here deadlocks against it: the caller's workflow
    # takes the lock, this called job then waits on the same name, and GitHub
    # cancels the pair ("deadlock detected for concurrency group"). Proven live
    # on the first v1.1.0 deploy (site-lentago-dev run 32057853117).

    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch_depth }}

      - name: Write version file
        if: inputs.version_file != ''
        env:
          VERSION_FILE: ${{ inputs.version_file }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$(dirname "$VERSION_FILE")"
          jq -n --arg sha "$SHA" --arg repo "$REPO" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run_url "$RUN_URL" \
            '{sha: $sha, repo: $repo, built_at: $built_at, run_url: $run_url}' > "$VERSION_FILE"
          cat "$VERSION_FILE"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies
        run: npm ci

      - name: Pre-build step
        if: inputs.pre_build_command != ''
        run: ${{ inputs.pre_build_command }}

      - name: Set build environment variables
        if: inputs.build_env_vars != ''
        env:
          BUILD_ENV_VARS: ${{ inputs.build_env_vars }}
        run: |
          while IFS= read -r line; do
            [[ -z "$line" || "$line" == "#"* ]] && continue
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done <<< "$BUILD_ENV_VARS"

      - name: Build static site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push container image
        id: build-push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPO: ${{ inputs.ecr_repo }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPO:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPO:$IMAGE_TAG"
          echo "image=$REGISTRY/$ECR_REPO:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build-push.outputs.image }}
          format: table
          exit-code: "0"
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Unconditional: the deploy below pins the task definition to this
      # digest whether or not the image is attested.
      - name: Resolve image digest
        id: digest
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPO: ${{ inputs.ecr_repo }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPO" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --no-cli-pager)
          if [[ "$DIGEST" != sha256:* ]]; then
            echo "::error::Could not resolve the digest of $ECR_REPO:$IMAGE_TAG (got '$DIGEST')"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/$ECR_REPO@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: inputs.attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr_repo }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: false

      - name: Register digest-pinned task definition
        id: taskdef
        env:
          ECS_CLUSTER: ${{ inputs.ecs_cluster }}
          ECS_SERVICE: ${{ inputs.ecs_service }}
          AWS_REGION: ${{ inputs.aws_region }}
          REPO_URI: ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr_repo }}
          IMAGE: ${{ steps.digest.outputs.image }}
        run: |
          CURRENT=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].taskDefinition' \
            --output text \
            --no-cli-pager)
          if [[ "$CURRENT" != arn:* ]]; then
            echo "::error::Service $ECS_SERVICE not found in cluster $ECS_CLUSTER (got '$CURRENT')"
            exit 1
          fi
          echo "Current task definition: $CURRENT"

          aws ecs describe-task-definition \
            --task-definition "$CURRENT" \
            --region "$AWS_REGION" \
            --query 'taskDefinition' \
            --output json \
            --no-cli-pager > current-taskdef.json

          # Exactly one container must pull from this ECR repo; that's the app.
          MATCHES=$(jq --arg repo "$REPO_URI" \
            '[.containerDefinitions[] | select(.image | startswith($repo + ":") or startswith($repo + "@"))] | length' \
            current-taskdef.json)
          if [[ "$MATCHES" != 1 ]]; then
            echo "::error::Expected exactly one container with image $REPO_URI in $CURRENT, found $MATCHES"
            exit 1
          fi

          # Drop the read-only fields describe returns but register rejects.
          jq --arg repo "$REPO_URI" --arg image "$IMAGE" '
            .containerDefinitions |= map(
              if (.image | startswith($repo + ":") or startswith($repo + "@"))
              then .image = $image else . end)
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' current-taskdef.json > new-taskdef.json

          NEW=$(aws ecs register-task-definition \
            --cli-input-json file://new-taskdef.json \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text \
            --no-cli-pager)
          echo "Registered $NEW with image $IMAGE"
          echo "arn=$NEW" >> "$GITHUB_OUTPUT"

      - name: Update ECS service
        env:
          ECS_CLUSTER: ${{ inputs.ecs_cluster }}
          ECS_SERVICE: ${{ inputs.ecs_service }}
          AWS_REGION: ${{ inputs.aws_region }}
          TASK_DEFINITION: ${{ steps.taskdef.outputs.arn }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION" \
            --region "$AWS_REGION" \
            --query 'service.taskDefinition' \
            --output text \
            --no-cli-pager

      - name: Wait for deployment to stabilize
        env:
          ECS_CLUSTER: ${{ inputs.ecs_cluster }}
          ECS_SERVICE: ${{ inputs.ecs_service }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
