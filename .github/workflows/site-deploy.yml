# ============================================================================
# Reusable: Astro site → ECR → ECS Fargate (site-deploy.yml)
# ============================================================================
# Builds an Astro static site, packages it into an nginx Docker image, pushes
# to ECR (sha + latest tags), runs a Trivy vulnerability scan, attests the
# image via actions/attest-build-provenance, then rolls the ECS service.
#
# Rollout check: the job passes only if the deployment it started is the one
# the service ends up running (PRIMARY, rolloutState COMPLETED). When the ECS
# deployment circuit breaker rolls a failed deployment back, the service
# stabilizes on the previous deployment and `wait services-stable` succeeds,
# so the waiter alone would report a rolled-back deploy as green. On failure
# the job prints the service's recent events.
#
# SLSA Build L3 note: building inside a reusable workflow (rather than a
# workflow defined in the caller's own repo) satisfies SLSA Build L3, because
# the build definition is hosted in a repository the calling repo cannot
# modify — eliminating the "hosted by the build requester" gap that caps
# direct workflows at L2.
#
# Authenticates via OIDC; no long-lived AWS credentials required.
#
# Version file: right after checkout (before any pre-build command) the
# workflow writes `version_file` (default public/version.json) containing
# {sha, repo, built_at, run_url}. Astro copies public/ verbatim, so the site
# serves it at /version.json and a probe can compare the live commit with
# `main`. Point `version_file` at another path if the site's public directory
# differs; set it to "" to disable the step.
#
# Required caller permissions (workflow-level or job-level):
#   id-token: write     — OIDC for AWS auth and attestation signing
#   contents: read      — standard repository checkout
#   attestations: write — store build provenance in GitHub's attestation store
#   packages: read      — required by actions/attest-build-provenance
#
# Attestations are stored in GitHub's Sigstore-backed store (not pushed to
# ECR). Verify after deployment:
#   gh attestation verify oci://<registry>/<ecr_repo>@<digest> --owner lentago
# ============================================================================

name: Site Deploy (reusable)

on:
  workflow_call:
    inputs:
      ecr_repo:
        description: "ECR repository name (e.g. solidago-dev-lentago)"
        type: string
        required: true
      ecs_cluster:
        description: "ECS cluster name (e.g. solidago-dev-cluster)"
        type: string
        required: true
      ecs_service:
        description: "ECS service name (e.g. solidago-dev-lentago)"
        type: string
        required: true
      role_arn:
        description: "AWS IAM role ARN to assume via OIDC"
        type: string
        required: true
      aws_region:
        description: "AWS region"
        type: string
        default: "us-east-1"
      node_version:
        description: "Node.js version for the Astro build"
        type: string
        default: "20"
      fetch_depth:
        description: "Git fetch depth passed to actions/checkout (0 = full history; required for Starlight lastUpdated)"
        type: number
        default: 1
      pre_build_command:
        description: "Optional shell command to run after npm ci and before npm run build (e.g. a content-sync script)"
        type: string
        default: ""
      build_env_vars:
        description: "Newline-separated KEY=VALUE pairs exported as environment variables before npm run build"
        type: string
        default: ""
      version_file:
        description: "Path of the JSON file recording the deployed commit, written after checkout and before the build (default public/version.json is served at /version.json); empty disables"
        type: string
        default: "public/version.json"
      attest:
        description: "Attest the pushed image with actions/attest-build-provenance (SLSA Build L3)"
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # NO job-level concurrency here — deliberately. Concurrency policy belongs
    # to the CALLER (all three site repos hold a workflow-level `deploy-main`
    # group). A group declared here deadlocks against it: the caller's workflow
    # takes the lock, this called job then waits on the same name, and GitHub
    # cancels the pair ("deadlock detected for concurrency group"). Proven live
    # on the first v1.1.0 deploy (site-lentago-dev run 32057853117).

    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch_depth }}

      - name: Write version file
        if: inputs.version_file != ''
        env:
          VERSION_FILE: ${{ inputs.version_file }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$(dirname "$VERSION_FILE")"
          jq -n --arg sha "$SHA" --arg repo "$REPO" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run_url "$RUN_URL" \
            '{sha: $sha, repo: $repo, built_at: $built_at, run_url: $run_url}' > "$VERSION_FILE"
          cat "$VERSION_FILE"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies
        run: npm ci

      - name: Pre-build step
        if: inputs.pre_build_command != ''
        run: ${{ inputs.pre_build_command }}

      - name: Set build environment variables
        if: inputs.build_env_vars != ''
        env:
          BUILD_ENV_VARS: ${{ inputs.build_env_vars }}
        run: |
          while IFS= read -r line; do
            [[ -z "$line" || "$line" == "#"* ]] && continue
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done <<< "$BUILD_ENV_VARS"

      - name: Build static site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push container image
        id: build-push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPO: ${{ inputs.ecr_repo }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPO:latest" \
            -t "$REGISTRY/$ECR_REPO:$IMAGE_TAG" \
            .
          docker push "$REGISTRY/$ECR_REPO:latest"
          docker push "$REGISTRY/$ECR_REPO:$IMAGE_TAG"
          echo "image=$REGISTRY/$ECR_REPO:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build-push.outputs.image }}
          format: table
          exit-code: "0"
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Get image digest for attestation
        id: digest
        if: inputs.attest
        env:
          ECR_REPO: ${{ inputs.ecr_repo }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPO" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text \
            --no-cli-pager)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: inputs.attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ecr-login.outputs.registry }}/${{ inputs.ecr_repo }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: false

      # Records the id of the deployment this run starts (the PRIMARY entry in
      # the update-service response), so the next step can check that this
      # deployment, and not a rollback, is what the service ends up running.
      - name: Force new ECS deployment
        id: ecs-update
        env:
          ECS_CLUSTER: ${{ inputs.ecs_cluster }}
          ECS_SERVICE: ${{ inputs.ecs_service }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          RESPONSE="$RUNNER_TEMP/ecs-update-service.json"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION" \
            --output json \
            --no-cli-pager > "$RESPONSE"

          read -r DEPLOYMENT_ID TASK_DEFINITION <<< "$(jq -r \
            '[.service.deployments[] | select(.status == "PRIMARY")][0] | "\(.id) \(.taskDefinition)"' \
            "$RESPONSE")"
          if [[ "$DEPLOYMENT_ID" != ecs-svc/* ]]; then
            echo "::error::update-service returned no PRIMARY deployment for $ECS_SERVICE (got '$DEPLOYMENT_ID')"
            jq '.service.deployments' "$RESPONSE"
            exit 1
          fi
          echo "Started deployment $DEPLOYMENT_ID with task definition $TASK_DEFINITION"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      # services-stable alone is not enough: with the deployment circuit
      # breaker's rollback on, a failed deployment is rolled back to the last
      # completed one, the service settles on that, and the waiter succeeds.
      # So after the wait, the deployment this run started must still be the
      # PRIMARY one and must have rolloutState COMPLETED. A rollback (or any
      # other update that replaced it) leaves a different PRIMARY and fails
      # the job. The check uses only ecs:DescribeServices, which the waiter
      # already needs.
      - name: Wait for deployment and verify rollout
        env:
          ECS_CLUSTER: ${{ inputs.ecs_cluster }}
          ECS_SERVICE: ${{ inputs.ecs_service }}
          AWS_REGION: ${{ inputs.aws_region }}
          DEPLOYMENT_ID: ${{ steps.ecs-update.outputs.deployment_id }}
        run: |
          print_events() {
            echo "Recent events for $ECS_SERVICE (newest first):"
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --region "$AWS_REGION" \
              --query 'services[0].events[:15].[createdAt, message]' \
              --output text \
              --no-cli-pager || true
          }

          primary_deployment() {
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --region "$AWS_REGION" \
              --query "services[0].deployments[?status=='PRIMARY'] | [0].[id, rolloutState, taskDefinition]" \
              --output text \
              --no-cli-pager
          }

          if ! aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --region "$AWS_REGION"; then
            echo "::error::$ECS_SERVICE did not reach a steady state for deployment $DEPLOYMENT_ID"
            print_events
            exit 1
          fi

          # The waiter can return a moment before ECS marks the deployment
          # COMPLETED, so give an IN_PROGRESS rollout up to two minutes.
          deadline=$((SECONDS + 120))
          while :; do
            if ! PRIMARY=$(primary_deployment); then
              echo "::error::Could not read the deployments of $ECS_SERVICE to verify deployment $DEPLOYMENT_ID"
              exit 1
            fi
            read -r PRIMARY_ID ROLLOUT_STATE RUNNING_TASK_DEFINITION <<< "$PRIMARY"
            if [[ "$PRIMARY_ID" != "$DEPLOYMENT_ID" || "$ROLLOUT_STATE" != IN_PROGRESS ]] \
                || (( SECONDS >= deadline )); then
              break
            fi
            sleep 10
          done

          if [[ "$PRIMARY_ID" == "$DEPLOYMENT_ID" && "$ROLLOUT_STATE" == COMPLETED ]]; then
            echo "Deployment $DEPLOYMENT_ID completed; $ECS_SERVICE runs $RUNNING_TASK_DEFINITION"
            exit 0
          fi

          if [[ "$PRIMARY_ID" != "$DEPLOYMENT_ID" ]]; then
            echo "::error::Deployment $DEPLOYMENT_ID did not go live: $ECS_SERVICE settled on deployment $PRIMARY_ID ($RUNNING_TASK_DEFINITION, rollout $ROLLOUT_STATE). The circuit breaker rolled it back, or another update replaced it."
          else
            echo "::error::Deployment $DEPLOYMENT_ID is PRIMARY but its rollout is $ROLLOUT_STATE, not COMPLETED"
          fi
          print_events
          exit 1
