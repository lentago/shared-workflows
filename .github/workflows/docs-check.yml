# ============================================================================
# Reusable: docs-check
# ============================================================================
# Resolves relative markdown links across a caller's git-tracked markdown and
# fails on genuinely broken ones. Designed to serve as a REQUIRED status check
# for docs-only PRs — the fleet's most common change class ships documentation,
# and renames/removals silently break relative links (see lentago/.github#57).
#
# UNCONDITIONAL BY DESIGN. Callers must trigger this on `pull_request` with NO
# `paths:` filter. A required check whose workflow never triggers is held
# "Expected" forever and deadlocks every non-matching PR — the hard rule
# recorded in fleet-ops/required-checks.json. For the same reason this job has
# no `if: draft` skip: a required check must always report a conclusion.
#
# FALSE POSITIVES: the checker skips site-absolute router routes (`/library/`)
# and links that escape the repo root (GitHub's `../../issues/N` nav
# convention) by rule — the two classes that were 237 of 240 raw failures in
# the #57 scan. Anything left is handled by the `ignore` input or a checked-in
# `.docs-check-ignore` file.
#
# The link resolver lives in this repo at ci/check_docs_links.py (a single,
# testable source — see ci/test_check_docs_links.py). This workflow checks the
# caller out, checks this repo out alongside it at the commit this workflow file
# came from (the caller's pinned tag), verifies that commit, and runs the script
# against the caller's tree.
# ============================================================================

name: docs-check (reusable)

on:
  workflow_call:
    inputs:
      ignore:
        description: "Newline-separated globs matched against source-file path or link target. For per-repo false positives not covered by the built-in site-absolute / escapes-root rules."
        type: string
        default: ""
      paths:
        description: "Space-separated git pathspecs to scan. Default discovers all tracked *.md and *.markdown."
        type: string
        default: "*.md *.markdown"

jobs:
  docs-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Pull the resolver from the commit this workflow file came from, so a
      # caller pinned to a tag runs that tag's resolver, not main's.
      #
      # Two earlier versions of this step got it wrong, and both looked fine
      # from this repo's own self-caller:
      # - `github.workflow_ref` is the CALLER's entry workflow, so external
      #   callers asked shared-workflows for their own PR ref and failed
      #   (`fatal: couldn't find remote ref refs/pull/N/merge`, #30).
      # - `github.job_workflow_ref` is not a property of the `github` context.
      #   It evaluated empty, the checkout below got no ref and took this
      #   repo's default branch, and every caller ran main's resolver whatever
      #   tag it pinned (#95).
      # `job.workflow_repository`, `job.workflow_ref` and `job.workflow_sha`
      # name the reusable workflow's own repository, ref and commit. An empty
      # value fails the job rather than letting checkout pick a default.
      - name: Resolve the resolver's commit
        id: swref
        env:
          WF_REPO: ${{ job.workflow_repository }}
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ ! "$WF_SHA" =~ ^[0-9a-f]{40}$ || -z "$WF_REPO" ]]; then
            echo "::error::docs-check can't tell which commit it runs from (job.workflow_repository '$WF_REPO', job.workflow_sha '$WF_SHA'), and won't fall back to a default branch"
            exit 1
          fi
          echo "repository=$WF_REPO" >> "$GITHUB_OUTPUT"
          echo "sha=$WF_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout docs-check tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.swref.outputs.repository }}
          ref: ${{ steps.swref.outputs.sha }}
          path: .docs-check-tooling
          fetch-depth: 1
          persist-credentials: false

      # The proof, on every run: the resolver about to run is the commit this
      # workflow came from, and when the caller pinned a tag, that tag
      # resolves to the same commit.
      - name: Verify the resolver is the pinned commit
        env:
          WF_FILE_REF: ${{ job.workflow_ref }}
          WF_SHA: ${{ steps.swref.outputs.sha }}
        run: |
          checked_out=$(git -C .docs-check-tooling rev-parse HEAD)
          if [[ "$checked_out" != "$WF_SHA" ]]; then
            echo "::error::the resolver checkout is at $checked_out, not $WF_SHA ($WF_FILE_REF)"
            exit 1
          fi
          pinned=${WF_FILE_REF##*@}
          if [[ "$pinned" == refs/tags/* ]]; then
            refs=$(git -C .docs-check-tooling ls-remote origin "$pinned" "$pinned^{}")
            tag_sha=$(awk -v r="$pinned^{}" '$2 == r {print $1}' <<< "$refs")
            [[ -n "$tag_sha" ]] || tag_sha=$(awk -v r="$pinned" '$2 == r {print $1}' <<< "$refs")
            if [[ "$tag_sha" != "$WF_SHA" ]]; then
              echo "::error::$pinned resolves to '${tag_sha:-nothing}', but this workflow runs from $WF_SHA"
              exit 1
            fi
          fi
          echo "Resolver: ci/check_docs_links.py at $WF_SHA, the commit of $WF_FILE_REF"

      - name: Check relative markdown links
        env:
          IGNORE_INPUT: ${{ inputs.ignore }}
          PATHS_INPUT: ${{ inputs.paths }}
        run: |
          set -euo pipefail

          # Fan the newline-separated ignore input into repeated --ignore flags.
          IGNORE_ARGS=()
          while IFS= read -r pat; do
            [[ -n "$pat" ]] && IGNORE_ARGS+=(--ignore "$pat")
          done <<< "$IGNORE_INPUT"

          # shellcheck disable=SC2086 # PATHS_INPUT is a deliberate space-split pathspec list
          python3 .docs-check-tooling/ci/check_docs_links.py \
            --root . \
            --paths $PATHS_INPUT \
            "${IGNORE_ARGS[@]}"
