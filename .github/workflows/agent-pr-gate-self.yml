# ============================================================================
# agent-pr-gate (self): run the reusable gate on this repo's own PRs
# ============================================================================
# The local path ref runs the PR's copy of the workflow, as docs-check-self.yml
# does. Unlike docs-check, the deciding script (ci/agent_pr_gate.py) comes from
# the PR's base commit: the workflow does that when it is called from this
# repo's own PR, so a PR can't edit the script that checks it. The workflow file
# itself can be changed only with `workflows: write` (README.md, the gate's
# limit). The trigger list is the one README.md gives callers. Making the
# context required is lentago/.github#289.
# ============================================================================

name: agent-pr-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, auto_merge_enabled]
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  agent-pr-gate:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/agent-pr-gate.yml
