# ============================================================================
# agent-pr-gate (self): run the reusable gate on this repo's own PRs
# ============================================================================
# The local path ref means a PR is checked by the gate inside that PR, as
# docs-check-self.yml does for the link resolver. The trigger list is the one
# README.md gives callers. Making the context required is lentago/.github#289.
# ============================================================================

name: agent-pr-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, auto_merge_enabled]
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  agent-pr-gate:
    permissions:
      contents: read
      pull-requests: read
      issues: read
    uses: ./.github/workflows/agent-pr-gate.yml
