# ============================================================================
# Reusable: Claude Code Review
# ============================================================================
# Reusable workflow for automated PR review. Callers wire up the on:
# pull_request trigger (with their own paths-ignore filter) and pass a
# repo-specific review_prompt; this workflow handles the boilerplate
# (PR context header, fleet PR-workflow checks, common rules, output format).
#
# Pinned to Haiku by default — review is mechanical pattern-matching.
#
# Advisory / non-blocking: the review step is continue-on-error and the job
# always exits 0, so a transient API failure or turn-budget exhaustion never
# reds the check or blocks auto-merge. max_turns defaults high enough that a
# normal review finishes before the cap.
#
# Posting: the model is read-only (gh pr diff / gh pr view / Read). Its final
# message IS the review; the "Post the review" step posts it as one PR comment
# headed "Review (<model>, claude-review.yml)" with a hidden run marker. If the
# run produced no review — the action failed, ran out of turns, or skipped
# itself (claude-code-action skips PRs that change the caller workflow) — that
# step posts the soft-fail notice instead, so a green check never stands in for
# a review that didn't happen. Draft PRs are skipped at the job level and get
# neither a review nor a notice. The post step is itself continue-on-error, so
# a failed post can't redden the check either (ADR-0003). (Before v1.5.0 nothing posted the review at all:
# it reached only the step summary.)
#
# SYNC OBLIGATION: the "Fleet PR-workflow checks" block in the prompt below
# mirrors the canonical "Fleet PR-workflow (canonical source)" section in
# this repo's CLAUDE.md. If you edit one, edit the other. Keep them
# semantically aligned — the .md guides actors, the prompt block frames the
# same rules as review criteria the reviewer flags.
# ============================================================================

name: Claude Code Review (reusable)

on:
  workflow_call:
    inputs:
      review_prompt:
        description: "Repo-specific focus block. Inserted between the PR-context header and the common rules."
        type: string
        required: true
      model:
        description: "Model to use for review"
        type: string
        default: "haiku"
      max_turns:
        description: "Max agent turns. Default is generous so a normal review completes before the cap (a too-tight cap made the reviewer exit non-zero before posting)."
        type: number
        default: 40
      allowed_bots:
        description: "Value for the action's allowed_bots input. Defaults to \"*\" so the fleet's runner-bot PRs are reviewed (every fleet PR is opened by lentago-claude-runner[bot]); pass a specific login to narrow, or \"\" to disable bot reviews entirely."
        type: string
        default: "*"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ inputs.allowed_bots }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out.

            ${{ inputs.review_prompt }}

            Fleet PR-workflow checks (flag PRs that violate any of these — these
            mirror the canonical rules in lentago/shared-workflows CLAUDE.md
            "Fleet PR-workflow (canonical source)"; treat each as a review item):

            1. ISSUE LINK — the PR body must contain `Closes #<n>`, `Fixes
               #<n>`, or `Resolves #<n>` so merge closes the linked issue.
               Inspect: `gh pr view ${{ github.event.pull_request.number }}
               --json body,title`. Flag if absent.
            2. TITLE ALIGNMENT — when an issue is linked, the PR title should
               match or clearly refine that issue's title (don't be pedantic
               about phrasing; flag only when the title is misleading about
               what the PR does).
            3. SCOPE DISCIPLINE — changes should match the linked issue's
               scope. Flag substantive unrelated changes bundled in
               (e.g., an issue about renaming X also rewrites unrelated Y).
               Adjacent fixes belong in separate tickets.
            4. CO-AUTHORSHIP DISCLOSURE — if README.md or CHANGELOG.md is
               among the changed files and the diff narrates substantive
               feature work, flag if the changed section lacks an explicit
               "Generated with Claude" / "Co-authored with Claude" disclosure
               at the top of that section (commit trailers alone are not
               enough — this is Chris's operator-not-SWE convention).
            5. PR SUMMARY — fleet-wide, every lentago repo: the PR body must
               carry a summary conveying the who/what/why of the change — what
               it does, the motivation behind it, and the substantive
               constraints — in a neutral, objective, professional voice.
               Inspect the body from the `gh pr view` call above. Flag if the
               summary is missing, if it just quotes the prompt verbatim, or if
               it reverts to third-person "X wanted…" narrative. There is no
               `## Origin` section and no `Prompt-Origin:` commit trailer — a
               neutral, action-oriented description woven into the summary is
               the convention.

            Rules:
            - Only comment on actual problems or meaningful improvements
            - Do NOT comment on style, formatting, or naming preferences
            - Do NOT give positive feedback or praise — just flag issues
            - Do NOT propose inline fix code — describe the problem and why it
              matters, not the solution. Fixes go through a separate commit.
            - If nothing significant is wrong, say so in one sentence and move on

            Output format:
            - Read the full diff and any source files needed for context
            - Collect ALL findings before producing any output
            - Your final message is posted verbatim as the review comment, so
              make it the complete review in Markdown: a numbered list with
              severity (major/minor), file:line, and one or two sentences per
              finding, or one sentence if nothing significant is wrong
            - Do not try to post anything yourself — you have no tool for it
          claude_args: |
            --max-turns ${{ inputs.max_turns }}
            --model ${{ inputs.model }}
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Read"

      - name: Post the review (or a soft-fail notice)
        if: always() && !cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MODEL: ${{ inputs.model }}
          RUN_ID: ${{ github.run_id }}
          OUTCOME: ${{ steps.claude.outcome }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re
          MAX = 60000  # GitHub caps a comment body at 65,536 characters
          result = ""
          try:
              path = os.environ.get("EXECUTION_FILE", "")
              if path and os.path.isfile(path):
                  raw = open(path).read().strip()
                  try:
                      data = json.loads(raw) if raw else []
                  except json.JSONDecodeError:
                      data = []
                      for line in raw.splitlines():
                          try:
                              data.append(json.loads(line))
                          except json.JSONDecodeError:
                              pass
                  if isinstance(data, dict):
                      data = data.get("messages") or data.get("events") or []
                  for m in reversed(data if isinstance(data, list) else []):
                      if isinstance(m, dict) and m.get("type") == "result":
                          if not m.get("is_error") and m.get("subtype") == "success":
                              result = str(m.get("result") or "").strip()
                          break
          except Exception:
              result = ""  # any parse problem falls through to the notice
          # Don't let review text ping people: break every @mention.
          result = re.sub(r"(?<![\w`])@(?=[A-Za-z0-9-])", "@\u200b", result)
          if len(result) > MAX:
              result = result[:MAX] + "\n\n…(truncated; the full review is in this run's step summary)"
          model, run = os.environ["MODEL"], os.environ["RUN_ID"]
          marker = f"<!-- claude-review run={run} model={model} -->"
          if result:
              body = f"{marker}\n## Review ({model}, claude-review.yml)\n\n{result}\n"
          else:
              body = (f"{marker}\n⚠️ The automated Claude review could not complete this run "
                      f"(outcome: {os.environ.get('OUTCOME') or 'unknown'}; a transient API or turn-budget "
                      "issue, or a PR that changes the reviewer's own workflow). This is **not a review**: "
                      "label the PR `re-review` to try again, or review it locally before arming "
                      "(lentago/.github ADR-0013).")
          open(os.path.join(os.environ["RUNNER_TEMP"], "review-body.md"), "w").write(body)
          PYEOF
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/review-body.md"

      - name: Render execution to step summary
        if: always() && steps.claude.outputs.execution_file != ''
        uses: lentago/shared-workflows/.github/actions/render-claude-summary@v1.5.0
        with:
          execution_file: ${{ steps.claude.outputs.execution_file }}
